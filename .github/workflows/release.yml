name: Release

# Push a tag like v0.2.0 and this builds Stackling for Apple Silicon and Intel,
# stamps the version into the app, and attaches the zip to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Build and package
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build.sh package
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/Stackling.zip \
            --title "Stackling ${GITHUB_REF_NAME#v}" \
            --generate-notes
