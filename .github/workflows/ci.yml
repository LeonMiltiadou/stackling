name: CI

# Builds the app and runs the tests on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Package the app
        run: scripts/build.sh package
